[project]
name = "possibly"
version = "0.1.0"
description = "Explore and choose app experiences before building, powered by Amplifier Agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "amplifier-agent @ git+https://github.com/microsoft/amplifier-agent@v0.17.0",
  "playwright>=1.50,<2",
  "openai>=1.0",
  "anthropic>=0.70",
  "google-genai>=1.0",
  "psutil>=7,<8",
]
[project.optional-dependencies]
# Preserve older install commands; these SDKs are now included by default.
anthropic = ["anthropic>=0.70"]
openai = ["openai>=1.0"]
dev = ["pytest>=8", "ruff>=0.12"]
mcp = ["mcp>=2.2,<3"]
[project.scripts]
possibly = "possibly.cli:main"
possibly-mcp = "possibly.mcp:main"
[project.urls]
Repository = "https://github.com/robotdad/possibly"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/possibly"]
[tool.pytest.ini_options]
addopts = "-p no:amplifier_module"
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
