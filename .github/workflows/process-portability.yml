name: Process portability
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  processes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Allow long dependency checkout paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q tests/test_processes.py
